[project]
name = "robotframework-xmlmergetool"
version = "2.0"
description = "Merge multiple Robot Framework XML output files into a single file."
authors = [
    { name = "XmlMergeTool contributors"}
    ]
requires-python = ">=3.13"
dependencies = [
    "lxml>=5.4.0",
    "openpyxl>=3.1,<4",
    "pyqt6>=6.9.0",
    "pyqt6-qt6>=6.9.0",
    "pyqt6-sip>=13.10.0",
    "robotframework==6.1.1",
]

[project.scripts]
xml-merge-tool = "xml_merge_tool.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "nuitka>=4.0",
    "pyinstaller>=6.16",
    "pytest>=9.0.2",
]
